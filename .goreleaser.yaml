version: 2
project_name: undo

builds:
  - main: ./cmd/undo
    binary: undo
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - shell/*
      - completions/*
      - build/libundo_amd64.so
      - build/libundo_arm64.so

nfpms:
  - formats: [deb, rpm, archlinux]
    description: Undo what the last shell command did to the filesystem
    homepage: https://github.com/edaywalid/undo
    license: MIT
    maintainer: edaywalid <becharwalid9@gmail.com>
    contents:
      - src: build/libundo_{{ .Arch }}.so
        dst: /usr/lib/undo/libundo.so
      - src: shell/undo.zsh
        dst: /usr/share/undo/undo.zsh
      - src: shell/undo.bash
        dst: /usr/share/undo/undo.bash
      - src: shell/undo.fish
        dst: /usr/share/undo/undo.fish
      - src: completions/_undo
        dst: /usr/share/zsh/site-functions/_undo
      - src: completions/undo.bash
        dst: /usr/share/bash-completion/completions/undo
      - src: completions/undo.fish
        dst: /usr/share/fish/vendor_completions.d/undo.fish

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - '^ci:'
      - '^docs:'

release:
  # A publish that dies partway leaves the assets uploaded, and the retry
  # then fails on every one of them as already existing, so the pipes after
  # it never run again. v0.2.9 died that way on an AUR outage and had to be
  # finished by hand. Overwrite instead, which makes a re-run the fix.
  replace_existing_artifacts: true

# The standard path for a Go project on Arch: goreleaser writes and pushes
# the -bin PKGBUILD itself, taking the checksums from the archives it just
# built, so pkgver and sums cannot drift apart. Arch guidelines reserve the
# plain name for source builds, hence -bin.
# The source package (undo-cli) stays manual: configuring aurs and
# aur_sources together is a known goreleaser panic.
aurs:
  - name: undo-cli-bin
    homepage: https://undo.edaywalid.com
    description: Revert what the last shell command did to the filesystem
    license: MIT
    maintainers:
      - 'edaywalid <becharwalid9 at gmail dot com>'
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: ssh://aur@aur.archlinux.org/undo-cli-bin.git
    commit_msg_template: 'undo-cli-bin {{ .Version }}'
    depends:
      - glibc
    optdepends:
      - 'zsh: shell hook'
      - 'bash: shell hook'
      - 'fish: shell hook'
    provides:
      - undo-cli
    conflicts:
      - undo-cli
    package: |-
      # every archive carries both shims, so pick the one for this arch
      case "$CARCH" in
        x86_64)  _so=build/libundo_amd64.so ;;
        aarch64) _so=build/libundo_arm64.so ;;
      esac
      install -Dm755 "./undo" "${pkgdir}/usr/bin/undo"
      install -Dm755 "./${_so}" "${pkgdir}/usr/lib/undo/libundo.so"
      install -Dm644 "./shell/undo.zsh"  "${pkgdir}/usr/share/undo/undo.zsh"
      install -Dm644 "./shell/undo.bash" "${pkgdir}/usr/share/undo/undo.bash"
      install -Dm644 "./shell/undo.fish" "${pkgdir}/usr/share/undo/undo.fish"
      install -Dm644 "./completions/_undo" "${pkgdir}/usr/share/zsh/site-functions/_undo"
      install -Dm644 "./completions/undo.bash" "${pkgdir}/usr/share/bash-completion/completions/undo"
      install -Dm644 "./completions/undo.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/undo.fish"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/undo-cli-bin/LICENSE"

# Kept on the deprecated `brews` key on purpose: its replacement,
# homebrew_casks, produces macOS-only casks, and undo is Linux-only. This
# formula is what Linuxbrew installs.
brews:
  - name: undo
    repository:
      owner: edaywalid
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    directory: Formula
    homepage: https://github.com/edaywalid/undo
    description: Undo what the last shell command did to the filesystem
    license: MIT
    install: |
      bin.install "undo"
      arch = Hardware::CPU.arm? ? "arm64" : "amd64"
      (lib/"undo").install "build/libundo_#{arch}.so" => "libundo.so"
      (share/"undo").install Dir["shell/*"]
      zsh_completion.install "completions/_undo"
      bash_completion.install "completions/undo.bash" => "undo"
      fish_completion.install "completions/undo.fish"
    caveats: |
      Add the hook for your shell:
        zsh:   source #{HOMEBREW_PREFIX}/share/undo/undo.zsh
        bash:  source #{HOMEBREW_PREFIX}/share/undo/undo.bash
        fish:  source #{HOMEBREW_PREFIX}/share/undo/undo.fish
    test: |
      system "#{bin}/undo", "--version"
